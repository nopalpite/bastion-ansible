---
- name: Installer sway, wayvnc et un terminal (foot)
  ansible.builtin.apt:
    name: [sway, wayvnc, foot]
    state: present
    update_cache: true

- name: Creer le dossier de config sway
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.config/sway"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Deployer la config sway (ecran virtuel + wayvnc au demarrage)
  ansible.builtin.copy:
    dest: "/home/{{ ansible_user }}/.config/sway/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    content: |
      output HEADLESS-1 resolution 1280x720
      exec wayvnc 0.0.0.0 5900
      # Un terminal au demarrage - sans ca, sway tourne mais l'ecran
      # reste gris uni (aucun fond d'ecran ni fenetre par defaut), rien
      # ne prouve visuellement que le compositeur repond.
      exec foot
  notify: Redemarrer sway-headless

- name: Deployer le service systemd sway headless
  ansible.builtin.template:
    src: sway-headless.service.j2
    dest: /etc/systemd/system/sway-headless.service
  notify: Redemarrer sway-headless

- name: Activer et demarrer sway-headless
  ansible.builtin.systemd:
    name: sway-headless
    enabled: true
    state: started
    daemon_reload: true
