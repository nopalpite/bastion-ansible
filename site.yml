---
# GENERE par scripts/render_site_yml.py a partir de order.yaml - ne pas
# editer les plays ci-dessous a la main, elles seraient ecrasees au
# prochain scaffold/reordonnancement. order.yaml est la source de verite
# de la sequence d'execution.
#
# Usage :
#   ansible-playbook site.yml               # tout le parc
#   ansible-playbook site.yml --limit gpio   # une seule typologie
#   ansible-playbook site.yml --check        # dry-run

- name: Base commune a tout le parc
  hosts: all
  become: true
  roles:
  - common
- name: Typologie desktop
  hosts: desktop
  become: true
  roles:
  - desktop
- name: Typologie gpio
  hosts: gpio
  become: true
  roles:
  - gpio
