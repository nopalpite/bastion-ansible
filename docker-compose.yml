# Runner Ansible - declenchement manuel pour l'instant (Phase 4 de la
# roadmap) : `docker compose run --rm runner [args ansible-playbook]`.
# Pas de "up -d" : ce service est concu pour etre lance a la demande, pas
# comme un daemon. Programmation (cron/scheduler) viendra plus tard si le
# besoin se confirme.
#
# Le bind mount ci-dessous est pour le developpement local uniquement
# (edite un role -> effet immediat, pas de rebuild) - il prend le pas
# sur le contenu deja copie dans l'image par le Dockerfile. Un
# deploiement qui consomme l'image publiee sans ce bind mount (ex:
# expolab) reste fonctionnel grace a ce contenu integre.
services:
  runner:
    build: .
    volumes:
      - .:/repo:ro
    environment:
      - BASTION_URL
      - BASTION_API_TOKEN

  # UI web (roles, declenchement, historique) - service supplementaire,
  # pas un remplacement du runner CLI ci-dessus. Meme image, entrypoint
  # different (lance Flask au lieu de ansible-playbook). Depot monte en
  # LECTURE-ECRITURE ici (contrairement au :ro du runner) : editer un
  # role via l'UI edite directement les fichiers du checkout git.
  webui:
    build: .
    entrypoint: ["python3", "webui/app.py"]
    ports:
      - "5055:5055"
    volumes:
      - .:/repo:rw
    environment:
      - BASTION_URL
      - BASTION_API_TOKEN
